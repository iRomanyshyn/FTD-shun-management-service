server:
  address: tcp://:9091
  # The image stores healthcheck metadata below /app. This stack keeps /app on
  # the read-only root filesystem, so disable that optional metadata writer.
  disable_healthcheck: true
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth

log:
  level: info

authentication_backend:
  # The file provider is an intentionally read-only local-lab bootstrap. Do
  # not offer flows that would need to modify users.yml.
  password_reset:
    disable: true
  password_change:
    disable: true
  file:
    path: /config/users.yml

access_control:
  default_policy: deny
  rules:
    - domain: '{{ env "FTD_SHUN_HOST" }}'
      policy: one_factor

session:
  cookies:
    - domain: '{{ env "AUTH_COOKIE_DOMAIN" }}'
      authelia_url: 'https://{{ env "AUTH_HOST" }}'
      default_redirection_url: 'https://{{ env "FTD_SHUN_HOST" }}'
      inactivity: '{{ env "AUTH_SESSION_INACTIVITY" }}'
      expiration: '{{ env "AUTH_SENSITIVE_ACTION_MAX_AGE" }}'
      same_site: strict

storage:
  local:
    path: /var/lib/authelia/db.sqlite3

notifier:
  filesystem:
    filename: /var/lib/authelia/notification.txt
