server:
  address: tcp://:9091
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth

log:
  level: info

authentication_backend:
  file:
    path: /config/users.yml

access_control:
  default_policy: deny
  rules:
    - domain: '{{ env "FTD_SHUN_HOST" }}'
      policy: one_factor

session:
  secret: '{{ env "AUTHELIA_SESSION_SECRET" }}'
  cookies:
    - domain: '{{ env "AUTH_COOKIE_DOMAIN" }}'
      authelia_url: 'https://{{ env "AUTH_HOST" }}'
      default_redirection_url: 'https://{{ env "FTD_SHUN_HOST" }}'
      inactivity: '{{ env "AUTH_SESSION_INACTIVITY" }}'
      expiration: '{{ env "AUTH_SENSITIVE_ACTION_MAX_AGE" }}'
      same_site: strict

storage:
  encryption_key: '{{ env "AUTHELIA_STORAGE_ENCRYPTION_KEY" }}'
  local:
    path: /var/lib/authelia/db.sqlite3

notifier:
  filesystem:
    filename: /var/lib/authelia/notification.txt
