# Opt-in credential migration, not a feature/write gate. Requires Compose 2.24.4+.
# See docs/manual/per-device-credentials.md before enabling or rolling back.
services:
  agent:
    environment:
      FTD_SHUN_SSH_CREDENTIALS_MODE: per-device
      FTD_SHUN_SSH_CREDENTIALS_FILE: /etc/ftd-shun-manager/agent-credentials.json
      FTD_SHUN_SSH_USERNAME: ""
      FTD_SHUN_SSH_PASSWORD_FILE: ""
    secrets: !reset []
    volumes:
      - type: bind
        source: ./agent-credentials.json
        target: /etc/ftd-shun-manager/agent-credentials.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/ftd
        target: /run/secrets/ftd
        read_only: true
        bind:
          create_host_path: false
