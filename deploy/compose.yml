services:
  socket-init:
    image: alpine:3.21
    # Initialize mount roots only; never traverse private backups or existing data.
    command: ["/bin/sh", "-ec", "mkdir -p /web /api /agent /state && chown 10001:10001 /web /api /state && chown 0:0 /agent && chmod 0770 /agent && chown 10002:10001 /agent"]
    volumes:
      - web-run:/web
      - api-run:/api
      - agent-run:/agent
      - state:/state
    network_mode: none
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev"]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "${PUBLISH_ADDRESS}:443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - web-run:/run/ftd-shun-manager:ro
    networks: [edge]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev"]

  authelia-data-init:
    image: alpine:3.21
    # The main Authelia process is non-root. This one-shot initializer is the
    # only container allowed to prepare ownership on its SQLite volume.
    command: ["/bin/sh", "-ec", "mkdir -p /var/lib/authelia && chown -R \"$$FTD_SHUN_AUTHELIA_UID:$$FTD_SHUN_AUTHELIA_GID\" /var/lib/authelia"]
    environment:
      FTD_SHUN_AUTHELIA_UID: "${FTD_SHUN_AUTHELIA_UID:-1000}"
      FTD_SHUN_AUTHELIA_GID: "${FTD_SHUN_AUTHELIA_GID:-1000}"
    volumes:
      - authelia-data:/var/lib/authelia
    network_mode: none
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev"]

  authelia:
    image: authelia/authelia:4.39.15
    restart: unless-stopped
    env_file: ../.env
    # The upstream entrypoint recursively chowns /config and calls su-exec. Our
    # protected configuration mounts are deliberately read-only, so invoke the
    # binary directly with every Linux capability removed instead.
    entrypoint: ["/app/authelia"]
    command: ["--config", "/config/configuration.yml"]
    environment:
      # Configuration-file templates are disabled by default in Authelia. This
      # enables only the non-secret deployment names in configuration.yml.
      X_AUTHELIA_CONFIG_FILTERS: template
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users.yml:/config/users.yml:ro
      - authelia-data:/var/lib/authelia
    depends_on:
      authelia-data-init:
        condition: service_completed_successfully
    networks: [edge]
    user: "${FTD_SHUN_AUTHELIA_UID:-1000}:${FTD_SHUN_AUTHELIA_GID:-1000}"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev"]

  web:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    command: ["ftd-shun-web"]
    environment:
      FTD_SHUN_WEB_SOCKET: /run/ftd-shun-manager/web.sock
      FTD_SHUN_API_SOCKET: /run/ftd-shun-manager-api/api.sock
      FTD_SHUN_DEVELOPMENT_AUTH: "false"
    volumes:
      - web-run:/run/ftd-shun-manager
      - api-run:/run/ftd-shun-manager-api:ro
    depends_on:
      socket-init:
        condition: service_completed_successfully
    network_mode: none
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev"]

  api:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    command: ["ftd-shun-api"]
    environment:
      FTD_SHUN_DATABASE: /var/lib/ftd-shun-manager/state.db
      FTD_SHUN_DEVICE_INVENTORY: /etc/ftd-shun-manager/devices.json
      FTD_SHUN_API_SOCKET: /run/ftd-shun-manager-api/api.sock
      FTD_SHUN_AGENT_SOCKET: /run/ftd-shun-manager-agent/agent.sock
      FTD_SHUN_AGENT_MODE: socket
    volumes:
      - api-run:/run/ftd-shun-manager-api
      - agent-run:/run/ftd-shun-manager-agent
      - state:/var/lib/ftd-shun-manager
      - ${FTD_SHUN_DEVICE_INVENTORY_PATH:-./devices.json}:/etc/ftd-shun-manager/devices.json:ro
    depends_on:
      socket-init:
        condition: service_completed_successfully
    network_mode: none
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev"]

  agent:
    build:
      context: ..
      dockerfile: agent/Dockerfile
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    env_file: ../.env
    environment:
      FTD_SHUN_DEVICE_INVENTORY: /etc/ftd-shun-manager/devices.json
      FTD_SHUN_AGENT_SOCKET: /run/ftd-shun-manager-agent/agent.sock
      FTD_SHUN_SSH_PASSWORD_FILE: /run/secrets/ftd_ssh_password
      FTD_SHUN_SSH_CREDENTIALS_MODE: shared
      FTD_SHUN_AGENT_PEER_UID: "10001"
    volumes:
      - agent-run:/run/ftd-shun-manager-agent
      - ${FTD_SHUN_DEVICE_INVENTORY_PATH:-./devices.json}:/etc/ftd-shun-manager/devices.json:ro
    secrets:
      - ftd_ssh_password
    depends_on:
      socket-init:
        condition: service_completed_successfully
    networks: [ftd-management]
    read_only: true
    user: "10002:10001"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev"]

networks:
  edge: {}
  ftd-management: {}

volumes:
  api-run: {}
  web-run: {}
  agent-run: {}
  state: {}
  caddy-data: {}
  caddy-config: {}
  authelia-data: {}

secrets:
  ftd_ssh_password:
    file: ./secrets/ftd_ssh_password
