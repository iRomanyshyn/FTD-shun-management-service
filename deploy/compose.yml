# Public runtime settings shared for Settings/profile validation; never include secrets here.
x-runtime-environment: &runtime-environment
  FTD_SHUN_API_RUNTIME: "${FTD_SHUN_API_RUNTIME:-legacy}"
  FTD_SHUN_AGENT_TIMEOUT_SECONDS: "${FTD_SHUN_AGENT_TIMEOUT_SECONDS:-45}"
  FTD_SHUN_AGENT_MAX_CONCURRENT_DEVICES: "${FTD_SHUN_AGENT_MAX_CONCURRENT_DEVICES:-1}"
  FTD_SHUN_AGENT_CYCLES_ENABLED: "${FTD_SHUN_AGENT_CYCLES_ENABLED:-false}"
  FTD_SHUN_LARGE_SNAPSHOTS_ENABLED: "${FTD_SHUN_LARGE_SNAPSHOTS_ENABLED:-false}"
  FTD_SHUN_AGENT_BATCH_ADDITIONS_ENABLED: "${FTD_SHUN_AGENT_BATCH_ADDITIONS_ENABLED:-false}"
  FTD_SHUN_AGENT_BATCH_SESSION_VERSION: "${FTD_SHUN_AGENT_BATCH_SESSION_VERSION:-5}"
  FTD_SHUN_IMPORT_UNBLOCKS_ENABLED: "${FTD_SHUN_IMPORT_UNBLOCKS_ENABLED:-false}"
  FTD_SHUN_DEFERRED_CONFIRMATION_ENABLED: "${FTD_SHUN_DEFERRED_CONFIRMATION_ENABLED:-false}"
  FTD_SHUN_IMPORT_ADMISSION_ENABLED: "${FTD_SHUN_IMPORT_ADMISSION_ENABLED:-false}"
  FTD_SHUN_IMPORT_EXECUTION_ENABLED: "${FTD_SHUN_IMPORT_EXECUTION_ENABLED:-false}"
  FTD_SHUN_MANAGED_REMOVAL_WORKER_ENABLED: "${FTD_SHUN_MANAGED_REMOVAL_WORKER_ENABLED:-false}"
  FTD_SHUN_MANAGED_RESTORATION_ENABLED: "${FTD_SHUN_MANAGED_RESTORATION_ENABLED:-false}"
  FTD_SHUN_MANAGED_POLICY_ADMISSION_ENABLED: "${FTD_SHUN_MANAGED_POLICY_ADMISSION_ENABLED:-false}"
  FTD_SHUN_MANAGED_REMOVAL_ADMISSION_ENABLED: "${FTD_SHUN_MANAGED_REMOVAL_ADMISSION_ENABLED:-false}"
  FTD_SHUN_POLL_INTERVAL: "${FTD_SHUN_POLL_INTERVAL:-5m}"
  FTD_SHUN_INTERACTIVE_REFRESH_MIN_INTERVAL: "${FTD_SHUN_INTERACTIVE_REFRESH_MIN_INTERVAL:-60s}"
  FTD_SHUN_HISTORY_RETENTION_DAYS: "${FTD_SHUN_HISTORY_RETENTION_DAYS:-366}"
  AUTH_SENSITIVE_ACTION_MAX_AGE: "${AUTH_SENSITIVE_ACTION_MAX_AGE:-24h}"

services:
  socket-init:
    image: alpine:3.21
    # Initialize mount roots only; never traverse private backups or existing data.
    command: ["/bin/sh", "-ec", "mkdir -p /web /api /agent /state && chown 10001:10001 /web /api /state && chown 0:0 /agent && chmod 0770 /agent && chown 10002:10001 /agent"]
    volumes:
      - web-run:/web
      - api-run:/api
      - agent-run:/agent
      - state:/state
    network_mode: none
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev"]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      FTD_SHUN_HOST: "${FTD_SHUN_HOST:?Set FTD_SHUN_HOST}"
      AUTH_HOST: "${AUTH_HOST:?Set AUTH_HOST}"
    ports:
      - "${PUBLISH_ADDRESS}:443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/security-headers.caddy:/etc/caddy/security-headers.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
      - web-run:/run/ftd-shun-manager:ro
    networks: [edge]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev"]

  authelia-data-init:
    image: alpine:3.21
    # The main Authelia process is non-root. This one-shot initializer is the
    # only container allowed to prepare ownership on its SQLite volume.
    command: ["/bin/sh", "-ec", "mkdir -p /var/lib/authelia && chown -R \"$$FTD_SHUN_AUTHELIA_UID:$$FTD_SHUN_AUTHELIA_GID\" /var/lib/authelia"]
    environment:
      FTD_SHUN_AUTHELIA_UID: "${FTD_SHUN_AUTHELIA_UID:-1000}"
      FTD_SHUN_AUTHELIA_GID: "${FTD_SHUN_AUTHELIA_GID:-1000}"
    volumes:
      - authelia-data:/var/lib/authelia
    network_mode: none
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev"]

  authelia:
    image: authelia/authelia:4.39.15
    restart: unless-stopped
    # The upstream entrypoint recursively chowns /config and calls su-exec. Our
    # protected configuration mounts are deliberately read-only, so invoke the
    # binary directly with every Linux capability removed instead.
    entrypoint: ["/app/authelia"]
    command: ["--config", "/config/configuration.yml"]
    environment:
      # Configuration-file templates are disabled by default in Authelia. This
      # enables only the non-secret deployment names in configuration.yml.
      X_AUTHELIA_CONFIG_FILTERS: template
      FTD_SHUN_HOST: "${FTD_SHUN_HOST:?Set FTD_SHUN_HOST}"
      AUTH_HOST: "${AUTH_HOST:?Set AUTH_HOST}"
      AUTH_COOKIE_DOMAIN: "${AUTH_COOKIE_DOMAIN:?Set AUTH_COOKIE_DOMAIN}"
      AUTH_SESSION_INACTIVITY: "${AUTH_SESSION_INACTIVITY:-1h}"
      AUTH_SENSITIVE_ACTION_MAX_AGE: "${AUTH_SENSITIVE_ACTION_MAX_AGE:-24h}"
      AUTHELIA_SESSION_SECRET: "${AUTHELIA_SESSION_SECRET:?Set AUTHELIA_SESSION_SECRET}"
      AUTHELIA_STORAGE_ENCRYPTION_KEY: "${AUTHELIA_STORAGE_ENCRYPTION_KEY:?Set AUTHELIA_STORAGE_ENCRYPTION_KEY}"
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users.yml:/config/users.yml:ro
      - authelia-data:/var/lib/authelia
    depends_on:
      authelia-data-init:
        condition: service_completed_successfully
    networks: [edge]
    user: "${FTD_SHUN_AUTHELIA_UID:-1000}:${FTD_SHUN_AUTHELIA_GID:-1000}"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev"]

  web:
    build: ..
    restart: unless-stopped
    command: ["ftd-shun-web"]
    environment:
      <<: *runtime-environment
      AUTH_HOST: "${AUTH_HOST:?Set AUTH_HOST}"
      FTD_SHUN_AGENT_MODE: socket
      FTD_SHUN_WEB_SOCKET: /run/ftd-shun-manager/web.sock
      FTD_SHUN_API_SOCKET: /run/ftd-shun-manager-api/api.sock
      FTD_SHUN_DEVELOPMENT_AUTH: "false"
    volumes:
      - web-run:/run/ftd-shun-manager
      - api-run:/run/ftd-shun-manager-api:ro
    depends_on:
      socket-init:
        condition: service_completed_successfully
    network_mode: none
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev"]

  api:
    build: ..
    restart: unless-stopped
    command: ["ftd-shun-api"]
    environment:
      <<: *runtime-environment
      FTD_SHUN_ENV_PROTECTED_NETWORKS: "${FTD_SHUN_ENV_PROTECTED_NETWORKS:-}"
      # Retained only for the one-time legacy import marker, not ongoing policy control.
      FTD_SHUN_TRUSTED_AUTO_REMOVE_IPS: "${FTD_SHUN_TRUSTED_AUTO_REMOVE_IPS:-}"
      FTD_SHUN_DEVELOPMENT_AUTH: "false"
      FTD_SHUN_DATABASE: /var/lib/ftd-shun-manager/state.db
      FTD_SHUN_DEVICE_INVENTORY: /etc/ftd-shun-manager/devices.json
      FTD_SHUN_API_SOCKET: /run/ftd-shun-manager-api/api.sock
      FTD_SHUN_AGENT_SOCKET: /run/ftd-shun-manager-agent/agent.sock
      FTD_SHUN_AGENT_MODE: socket
    volumes:
      - api-run:/run/ftd-shun-manager-api
      - agent-run:/run/ftd-shun-manager-agent
      - state:/var/lib/ftd-shun-manager
      - ${FTD_SHUN_DEVICE_INVENTORY_PATH:-./devices.json}:/etc/ftd-shun-manager/devices.json:ro
    depends_on:
      socket-init:
        condition: service_completed_successfully
    network_mode: none
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev"]

  agent:
    build:
      context: ..
      dockerfile: agent/Dockerfile
    restart: unless-stopped
    # Let admitted bounded RPCs finish after SIGTERM; drain API first.
    stop_grace_period: 300s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      FTD_SHUN_DEVICE_INVENTORY: /etc/ftd-shun-manager/devices.json
      FTD_SHUN_AGENT_SOCKET: /run/ftd-shun-manager-agent/agent.sock
      FTD_SHUN_SSH_USERNAME: "${FTD_SHUN_SSH_USERNAME:-}"
      FTD_SHUN_AGENT_TIMEOUT_SECONDS: "${FTD_SHUN_AGENT_TIMEOUT_SECONDS:-45}"
      FTD_SHUN_AGENT_MAX_CONCURRENT_DEVICES: "${FTD_SHUN_AGENT_MAX_CONCURRENT_DEVICES:-1}"
      FTD_SHUN_AGENT_CYCLES_ENABLED: "${FTD_SHUN_AGENT_CYCLES_ENABLED:-false}"
      FTD_SHUN_LARGE_SNAPSHOTS_ENABLED: "${FTD_SHUN_LARGE_SNAPSHOTS_ENABLED:-false}"
      FTD_SHUN_AGENT_ADDITIONS_ENABLED: "${FTD_SHUN_AGENT_ADDITIONS_ENABLED:-false}"
      FTD_SHUN_AGENT_BATCH_ADDITIONS_ENABLED: "${FTD_SHUN_AGENT_BATCH_ADDITIONS_ENABLED:-false}"
      FTD_SHUN_AGENT_BATCH_SESSION_VERSION: "${FTD_SHUN_AGENT_BATCH_SESSION_VERSION:-5}"
      FTD_SHUN_DEFERRED_CONFIRMATION_ENABLED: "${FTD_SHUN_DEFERRED_CONFIRMATION_ENABLED:-false}"
      FTD_SHUN_ENV_PROTECTED_NETWORKS: "${FTD_SHUN_ENV_PROTECTED_NETWORKS:-}"
      # Null leaves an unset optional value absent, preserving agent validation.
      FTD_SHUN_AGENT_PENDING_JOURNAL_DIRECTORY:
      FTD_SHUN_SSH_PASSWORD_FILE: /run/secrets/ftd_ssh_password
      FTD_SHUN_SSH_CREDENTIALS_MODE: shared
      FTD_SHUN_AGENT_PEER_UID: "10001"
    volumes:
      - agent-run:/run/ftd-shun-manager-agent
      - ${FTD_SHUN_DEVICE_INVENTORY_PATH:-./devices.json}:/etc/ftd-shun-manager/devices.json:ro
    secrets:
      - ftd_ssh_password
    depends_on:
      socket-init:
        condition: service_completed_successfully
    networks: [ftd-management]
    read_only: true
    user: "10002:10001"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev"]

networks:
  edge: {}
  ftd-management: {}

volumes:
  api-run: {}
  web-run: {}
  agent-run: {}
  state: {}
  caddy-data: {}
  caddy-config: {}
  authelia-data: {}

secrets:
  ftd_ssh_password:
    file: ./secrets/ftd_ssh_password
