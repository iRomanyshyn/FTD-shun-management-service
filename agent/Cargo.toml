[package]
name = "ftd-shun-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
anyhow = "1.0.100"
nix = { version = "0.31.3", features = ["socket"] }
russh = { version = "0.63.2", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tokio = { version = "1.48.0", features = ["macros", "rt", "time"] }
zeroize = "1.8.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

