[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ftd-shun-management-service"
version = "0.1.0"
description = "Security-focused Cisco FTD shun monitoring and management service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
ftd-shun-api = "ftd_shun_manager.api:main"
ftd-shun-web = "ftd_shun_manager.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ftd_shun_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
